<style id="mk-admin-styles">
/* Marketplace management & seller pages — aligned with the SmartPOS shell (teal brand, slate neutrals). */
.mk-page{max-width:1200px;margin:0 auto;display:grid;gap:1.1rem;min-width:0}
.mk-narrow{max-width:880px}
.mk-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.mk-head>div:first-child{min-width:0}
.mk-eyebrow{font-size:.6875rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#0f766e;margin:0 0 .25rem}
.mk-title{font-size:1.5rem;font-weight:700;line-height:1.25;color:#0f172a;margin:0;overflow-wrap:anywhere}
.mk-sub{font-size:.875rem;color:#64748b;margin:.3rem 0 0;max-width:62ch}
.mk-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.mk-actions form{margin:0}
.mk-back{display:inline-flex;align-items:center;gap:.35rem;font-size:.8125rem;font-weight:600;color:#0f766e;margin-bottom:.35rem}
.mk-back:hover{color:#115e59}

/* Section tabs: keep every item at its natural width and allow touch scrolling on mobile. */
.mk-tabs{
 display:flex;flex-flow:row nowrap;align-items:stretch;gap:.25rem;
 width:100%;max-width:100%;min-width:0;box-sizing:border-box;
 overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;
 -webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;
 border-bottom:1px solid #e2e8f0;scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent;
 padding:0 .05rem;scroll-padding-inline:.75rem;
}
.mk-tabs::-webkit-scrollbar{height:4px}
.mk-tabs::-webkit-scrollbar-track{background:transparent}
.mk-tabs::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}
.mk-tab{
 display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;
 box-sizing:border-box;min-height:42px;max-width:none;padding:.65rem .85rem;
 font-size:.8125rem;line-height:1.25;font-weight:600;color:#64748b;
 border:0;border-bottom:2px solid transparent;margin:0 0 -1px;
 white-space:nowrap;text-decoration:none;transition:color .15s,border-color .15s;
 scroll-snap-align:start;
}
.mk-tab:hover{color:#0f172a}
.mk-tab:focus-visible{outline:2px solid #0f766e;outline-offset:-3px;border-radius:.35rem}
.mk-tab.is-active{color:#0f766e;border-bottom-color:#0f766e}
@media(max-width:640px){
 .mk-tabs{gap:.15rem;margin-inline:0;padding-inline:0;scrollbar-width:thin}
 .mk-tab{min-height:44px;padding:.7rem .75rem;font-size:.8rem}
}

/* Cards */
.mk-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;box-shadow:0 1px 2px rgba(15,23,42,.04);min-width:0}
.mk-pad{padding:1.1rem 1.25rem}
.mk-sec-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:1rem 1.25rem;border-bottom:1px solid #e2e8f0}
.mk-sec-head h2{font-size:1rem;font-weight:700;color:#0f172a;margin:0}
.mk-sec-head p{font-size:.8125rem;color:#64748b;margin:.2rem 0 0}
.mk-note{display:flex;gap:.6rem;padding:.8rem 1rem;border-radius:.75rem;background:#f0fdfa;border:1px solid #ccfbf1;color:#115e59;font-size:.8125rem;line-height:1.5}
.mk-note.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}

/* Stats */
.mk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:.75rem}
.mk-stat{padding:1rem 1.1rem}
.mk-stat-label{font-size:.75rem;font-weight:600;color:#64748b}
.mk-stat-value{font-size:1.5rem;font-weight:700;color:#0f172a;line-height:1.2;margin-top:.2rem;font-variant-numeric:tabular-nums}
.mk-stat-hint{font-size:.75rem;color:#94a3b8;margin-top:.15rem}

/* Tables */
.mk-table-wrap{overflow-x:auto}
.mk-table{width:100%;min-width:720px;border-collapse:collapse;font-size:.8125rem}
.mk-table th{text-align:left;font-size:.6875rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748b;padding:.65rem 1rem;background:#f8fafc;border-bottom:1px solid #e2e8f0;white-space:nowrap}
.mk-table td{padding:.75rem 1rem;border-bottom:1px solid #f1f5f9;vertical-align:middle;color:#334155}
.mk-table tbody tr:hover{background:#f8fafc}
.mk-table tbody tr:last-child td{border-bottom:0}
.mk-table .mk-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mk-table .mk-ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;color:#475569;overflow-wrap:anywhere;max-width:190px}
.mk-strong{font-weight:600;color:#0f172a}
.mk-muted{color:#64748b;font-size:.75rem}
.mk-cell-actions{display:flex;gap:.4rem;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.mk-cell-actions form{margin:0}
.mk-prod{display:flex;align-items:center;gap:.75rem;min-width:0}
.mk-thumb{width:44px;height:44px;flex:none;border-radius:.6rem;object-fit:cover;border:1px solid #e2e8f0;background:#f1f5f9;display:block}
.mk-thumb-empty{display:grid;place-items:center;font-size:.6rem;color:#94a3b8;text-align:center;line-height:1.1}
.mk-btn-danger-soft{color:#b91c1c!important;border-color:#fecaca!important;background:#fff!important}
.mk-btn-danger-soft:hover{background:#fef2f2!important}

/* Badges */
.mk-badge{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.15rem .6rem;font-size:.72rem;font-weight:600;line-height:1.1rem;background:#f1f5f9;color:#475569;white-space:nowrap}
.mk-badge::before{content:"";width:.4rem;height:.4rem;border-radius:50%;background:currentColor;opacity:.7}
.mk-b-ok,.mk-b-paid,.mk-b-fulfilled,.mk-b-active,.mk-b-approved,.mk-b-published{background:#dcfce7;color:#15803d}
.mk-b-warn,.mk-b-pending,.mk-b-awaiting_payment,.mk-b-contacted,.mk-b-hidden{background:#fef3c7;color:#92400e}
.mk-b-info,.mk-b-new,.mk-b-confirmed{background:#e0f2fe;color:#0369a1}
.mk-b-out_for_delivery{background:#ede9fe;color:#6d28d9}
.mk-b-bad,.mk-b-failed,.mk-b-cancelled,.mk-b-rejected,.mk-b-expired{background:#fee2e2;color:#b91c1c}
.mk-b-unpaid,.mk-b-refunded,.mk-b-muted{background:#f1f5f9;color:#475569}

/* Toolbar, search, pager */
.mk-search{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.mk-input,.mk-search input,.mk-filter input,.mk-filter select,.mk-form input:not([type=checkbox]):not([type=radio]):not([type=file]),.mk-form select,.mk-form textarea{box-sizing:border-box;width:100%;min-height:2.5rem;padding:.55rem .8rem;border:1px solid #e2e8f0;border-radius:.625rem;background-color:#fff;color:#0f172a;font:inherit;font-size:.875rem;transition:border-color .15s,box-shadow .15s}
.mk-search input{width:min(300px,100%)}
.mk-input:focus,.mk-search input:focus,.mk-filter input:focus,.mk-filter select:focus,.mk-form input:focus,.mk-form select:focus,.mk-form textarea:focus{outline:0;border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.mk-pager{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.85rem 1.25rem;border-top:1px solid #e2e8f0;font-size:.8125rem;color:#64748b}
.mk-pager-nav{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.mk-page-current{min-width:2.25rem;padding:.4rem .6rem;border-radius:.5rem;background:#0f766e;color:#fff;font-weight:600;text-align:center;font-size:.8125rem}
.mk-filter{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.75rem;align-items:end}
.mk-filter label{display:grid;gap:.3rem;font-size:.75rem;font-weight:600;color:#475569}
.mk-empty{padding:2.5rem 1rem;text-align:center;color:#64748b;font-size:.875rem}
.mk-empty b{display:block;color:#0f172a;font-size:.95rem;margin-bottom:.25rem}

/* Forms */
.mk-form{display:grid;gap:1.1rem}
.mk-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.mk-field{display:grid;gap:.35rem;align-content:start;min-width:0}
.mk-field.full{grid-column:1/-1}
.mk-label{font-size:.8125rem;font-weight:600;color:#334155}
.mk-req{color:#dc2626;margin-left:.15rem}
.mk-help{font-size:.75rem;color:#64748b;line-height:1.4}
.mk-error{font-size:.75rem;color:#b91c1c}
.mk-form textarea{min-height:7rem;resize:vertical}
.mk-form input[type=file]{width:100%;padding:.6rem;border:1px dashed #cbd5e1;border-radius:.625rem;background:#f8fafc;font-size:.8125rem}
.mk-check{display:flex;align-items:center;gap:.6rem;font-size:.875rem;font-weight:500;color:#334155;cursor:pointer}
.mk-check input{width:1.05rem;height:1.05rem;accent-color:#0f766e;flex:none}
.mk-form-actions{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap;padding-top:1rem;border-top:1px solid #e2e8f0}
.mk-photo{display:flex;gap:1rem;align-items:center;padding:.9rem;border:1px solid #e2e8f0;border-radius:.75rem;background:#f8fafc}
.mk-photo img{width:84px;height:84px;object-fit:cover;border-radius:.6rem;border:1px solid #e2e8f0;flex:none}
.mk-photo p{margin:0;font-size:.8125rem;color:#64748b}
.mk-form-errors{padding:.75rem 1rem;border-radius:.75rem;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;font-size:.8125rem}
.mk-form-errors ul{margin:0;padding-left:1.1rem}
.mk-fieldset-title{font-size:.9rem;font-weight:700;color:#0f172a;margin:.25rem 0 0;padding-top:1rem;border-top:1px solid #e2e8f0}

/* Key/value details and layout */
.mk-two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:1rem;align-items:start}
.mk-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.75rem}
.mk-kv>div{padding:.7rem .85rem;background:#f8fafc;border-radius:.65rem;min-width:0}
.mk-kv small{display:block;font-size:.6875rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#64748b}
.mk-kv strong{display:block;margin-top:.15rem;font-size:.875rem;color:#0f172a;overflow-wrap:anywhere;font-weight:600}
.mk-total{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-top:1px solid #e2e8f0;font-weight:700;color:#0f172a}
.mk-total span:last-child{font-size:1.15rem;font-variant-numeric:tabular-nums}

/* Seller centre */
.mk-grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.9rem}
.mk-tile{border:1px solid #e2e8f0;border-radius:.85rem;padding:1rem;background:#fff;display:grid;gap:.5rem;align-content:start}
.mk-tile h3{font-size:.9375rem;font-weight:700;color:#0f172a;margin:0;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.mk-tile p{margin:0;font-size:.8125rem;color:#64748b;line-height:1.5}
.mk-tile form{margin:.25rem 0 0}
.mk-list{display:grid}
.mk-list-row{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.65rem 0;border-bottom:1px solid #f1f5f9;font-size:.8125rem}
.mk-list-row:last-child{border-bottom:0}
.mk-link-box{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.mk-link-box code{flex:1;min-width:0;padding:.5rem .7rem;background:#f8fafc;border:1px solid #e2e8f0;border-radius:.55rem;font-size:.75rem;color:#334155;overflow-wrap:anywhere}
.mk-request{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid #f1f5f9}
.mk-request:last-child{border-bottom:0}
.mk-request h3{font-size:.9375rem;font-weight:700;color:#0f172a;margin:0 0 .2rem}
.mk-review{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:.5rem;align-items:center;margin-top:1rem}
.mk-review form{display:contents}

/* Order workflow */
.mk-chips{display:flex;gap:.4rem;flex-wrap:wrap}
.mk-chip{padding:.4rem .8rem;border-radius:999px;border:1px solid #e2e8f0;background:#fff;font-size:.78rem;font-weight:600;color:#475569;white-space:nowrap}
.mk-chip:hover{border-color:#0f766e;color:#0f766e}
.mk-chip.is-active{background:#0f766e;border-color:#0f766e;color:#fff}
.mk-steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.mk-steps li{position:relative;padding:0 0 1rem 1.6rem;font-size:.8125rem;color:#334155}
.mk-steps li::before{content:"";position:absolute;left:.3rem;top:.3rem;width:.55rem;height:.55rem;border-radius:50%;background:#0f766e}
.mk-steps li::after{content:"";position:absolute;left:.5rem;top:.95rem;bottom:-.1rem;width:1px;background:#cbd5e1}
.mk-steps li:last-child::after{display:none}
.mk-steps small{display:block;color:#64748b;font-size:.72rem;margin-top:.1rem}
.mk-act{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.75rem}
.mk-act .btn{flex:1 1 150px}
.mk-cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.75rem 1.25rem;border-bottom:1px solid #f1f5f9}
.mk-cat-row:last-child{border-bottom:0}
.mk-cat-row form{margin:0;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.mk-cat-row input[type=text]{min-height:2.2rem;padding:.4rem .7rem;border:1px solid #e2e8f0;border-radius:.55rem;font-size:.8125rem;width:min(220px,100%)}
@media(max-width:640px){.mk-cat-row{grid-template-columns:1fr;padding-left:1rem;padding-right:1rem}}

@media(max-width:900px){.mk-two{grid-template-columns:1fr}}
@media(max-width:640px){
 .mk-title{font-size:1.25rem}
 .mk-form-grid{grid-template-columns:1fr}
 .mk-pad,.mk-sec-head,.mk-pager{padding-left:1rem;padding-right:1rem}
 .mk-request{grid-template-columns:1fr}
 .mk-review{grid-template-columns:1fr 1fr}
 .mk-review input{grid-column:1/-1}
 .mk-form-actions .btn{flex:1}
 .mk-photo{flex-direction:column;align-items:flex-start}
}


/* V73 professional consistency layer: shared across every Marketplace management screen. */
.mk-page{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;gap:1rem}
.mk-page a:not(.btn):not(.mk-tab):not(.mk-chip){color:#0f766e;text-decoration:none}
.mk-page a:not(.btn):not(.mk-tab):not(.mk-chip):hover{color:#115e59;text-decoration:underline;text-underline-offset:3px}
.mk-page a:focus-visible,.mk-page button:focus-visible,.mk-page input:focus-visible,.mk-page select:focus-visible,.mk-page textarea:focus-visible{outline:3px solid rgba(20,184,166,.35);outline-offset:2px}
.mk-page .mk-title{letter-spacing:-.035em;font-size:clamp(1.3rem,2.2vw,1.7rem)}
.mk-page .mk-sub{line-height:1.6}
.mk-page .mk-card{border-color:#e2e8f0;border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.035);overflow:hidden}
.mk-page .mk-card:hover{border-color:#d3dfdf}
.mk-page .mk-pad{padding:clamp(1rem,2vw,1.35rem)}
.mk-page .mk-sec-head{background:linear-gradient(180deg,#fff,#fbfdfd)}
.mk-page .mk-stat{position:relative;overflow:hidden;transition:border-color .16s,transform .16s,box-shadow .16s}
.mk-page .mk-stat:hover{border-color:#b7d9d4;box-shadow:0 5px 18px rgba(15,118,110,.07);transform:translateY(-1px)}
.mk-page .mk-stat-value{letter-spacing:-.035em}
.mk-page .mk-table-wrap{border-radius:0 0 14px 14px;max-width:100%;overscroll-behavior-x:contain}
.mk-page .mk-table th{background:#f8fafc;color:#526174}
.mk-page .mk-table td{line-height:1.5}
.mk-page .mk-table tbody tr:focus-within{background:#f0fdfa}
.mk-page .mk-b-out_for_delivery{background:#f1f5f9;color:#475569}
.mk-page .mk-tabs{scrollbar-width:thin}
.mk-page .mk-tab{border-radius:8px 8px 0 0}
.mk-page .mk-tab.is-active{background:linear-gradient(180deg,rgba(240,253,250,.85),rgba(240,253,250,0));}
.mk-page .mk-btn-danger-soft{color:#b91c1c!important}
.mk-page .mk-search input,.mk-page .mk-filter input,.mk-page .mk-filter select,.mk-page .mk-form input:not([type=checkbox]):not([type=radio]):not([type=file]),.mk-page .mk-form select,.mk-page .mk-form textarea{min-height:42px;border-color:#dbe3ec;border-radius:9px}
.mk-page .mk-form textarea{line-height:1.55}
.mk-page .mk-form-actions{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);z-index:2;padding:1rem 0 .25rem}
.mk-page .mk-photo{background:#f8fafc;border-color:#e2e8f0}
.mk-page .mk-tile{border-radius:12px;transition:border-color .16s,box-shadow .16s,transform .16s}
.mk-page .mk-tile:hover{border-color:#b7d9d4;box-shadow:0 6px 18px rgba(15,23,42,.045);transform:translateY(-1px)}
.mk-page .mk-chip{transition:background .15s,border-color .15s,color .15s}
.mk-page .mk-chip.is-active{background:#0f766e;border-color:#0f766e;color:#fff}
.mk-page .mk-pager a,.mk-page .mk-pager-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:.4rem .65rem;border:1px solid #e2e8f0;border-radius:8px;background:#fff;color:#334155;text-decoration:none}
.mk-page .mk-pager a:hover,.mk-page .mk-pager-nav a:hover{background:#f0fdfa;border-color:#99d5ce;color:#115e59}
.mk-page .mk-page-current{border-radius:8px;background:#0f766e}
.mk-page .mk-note{line-height:1.6;border-radius:10px}
.mk-page .mk-empty{padding:clamp(2rem,5vw,3.25rem) 1rem}
.mk-page .mk-request{gap:1rem}
.mk-page img{max-width:100%}
@media(max-width:760px){
 .mk-page{gap:.85rem}
 .mk-page .mk-head{align-items:stretch}
 .mk-page .mk-actions{width:100%}
 .mk-page .mk-actions .btn{flex:1 1 auto}
 .mk-page .mk-two{grid-template-columns:minmax(0,1fr)}
 .mk-page .mk-grid-2{grid-template-columns:minmax(0,1fr)}
 .mk-page .mk-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .mk-page .mk-stat{padding:.85rem}
 .mk-page .mk-stat-value{font-size:1.25rem;overflow-wrap:anywhere}
 .mk-page .mk-review{grid-template-columns:minmax(0,1fr)}
 .mk-page .mk-review input{grid-column:auto}
 .mk-page .mk-form-actions{position:static}
 .mk-page .mk-form-actions .btn{width:100%}
}
@media(max-width:420px){
 .mk-page .mk-stats{grid-template-columns:minmax(0,1fr)}
 .mk-page .mk-title{font-size:1.22rem}
 .mk-page .mk-actions .btn{flex:1 1 100%}
 .mk-page .mk-photo img{width:68px;height:68px}
}
@media(prefers-reduced-motion:reduce){.mk-page .mk-stat,.mk-page .mk-tile{transition:none}}


/* V74 Seller Centre pro layer: breadcrumb header, sectioned forms, side panel, provider/type cards. */
.mk-crumbs{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.78rem;color:#94a3b8;margin:0 0 .6rem}
.mk-crumbs a{color:#64748b!important;font-weight:500}.mk-crumbs a:hover{color:#0f766e!important}
.mk-crumbs svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.mk-crumbs b{color:#334155;font-weight:600}
.mk-hero{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:1.15rem 1.35rem;border:1px solid #e2e8f0;border-radius:16px;background:linear-gradient(120deg,#f0fdfa 0%,#fff 62%);box-shadow:0 1px 2px rgba(15,23,42,.03)}
.mk-hero-main{display:flex;gap:.95rem;align-items:center;min-width:0}
.mk-hero-icon{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:13px;background:#ccfbf1;color:#0f766e}
.mk-hero-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mk-hero h1{margin:0;font-size:clamp(1.2rem,2.2vw,1.55rem);font-weight:750;letter-spacing:-.03em;color:#0f172a;line-height:1.25;overflow-wrap:anywhere}
.mk-hero p{margin:.2rem 0 0;font-size:.875rem;color:#64748b;line-height:1.55;max-width:64ch}
.mk-hero .mk-actions{flex:none}
.mk-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:1.1rem;align-items:start}
.mk-layout.is-single{grid-template-columns:minmax(0,1fr)}
.mk-main{display:grid;gap:1rem;min-width:0}
.mk-aside{display:grid;gap:1rem;position:sticky;top:1rem;min-width:0}
.mk-sect[hidden]{display:none}
.mk-sect{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.035);min-width:0}
.mk-sect-h{display:flex;gap:.8rem;align-items:flex-start;padding:1rem 1.25rem;border-bottom:1px solid #eef2f6}
.mk-sect-ico{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:10px;background:#f0fdfa;color:#0f766e}
.mk-sect-ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mk-sect-h h2{margin:0;font-size:.95rem;font-weight:700;color:#0f172a;letter-spacing:-.01em}
.mk-sect-h p{margin:.15rem 0 0;font-size:.8125rem;color:#64748b;line-height:1.5}
.mk-sect-b{padding:1.1rem 1.25rem;display:grid;gap:1rem}
.mk-sect-b .mk-form-grid{gap:1rem}
.mk-aside-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:1.05rem 1.15rem;display:grid;gap:.7rem;box-shadow:0 1px 2px rgba(15,23,42,.035)}
.mk-aside-card h3{margin:0;font-size:.8125rem;font-weight:700;color:#0f172a;letter-spacing:.01em;display:flex;gap:.45rem;align-items:center}
.mk-aside-card h3 svg{width:16px;height:16px;stroke:#0f766e;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mk-aside-card p{margin:0;font-size:.8125rem;color:#64748b;line-height:1.6}
.mk-aside-card.is-tint{background:#f8fafc}
.mk-aside-card.is-warn{background:#fffbeb;border-color:#fde68a}.mk-aside-card.is-warn p,.mk-aside-card.is-warn h3{color:#92400e}
.mk-checklist{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.mk-checklist li{display:flex;gap:.6rem;align-items:flex-start;font-size:.8125rem;color:#475569;line-height:1.5}
.mk-checklist li i{flex:none;display:grid;place-items:center;width:18px;height:18px;margin-top:.1rem;border-radius:50%;background:#e2e8f0;color:#fff;font-style:normal}
.mk-checklist li i svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mk-checklist li.is-done i{background:#0f766e}.mk-checklist li.is-done{color:#0f172a}
.mk-checklist li b{color:#0f172a;font-weight:600}
/* choice cards (provider, listing kind, environment) */
.mk-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.75rem}
.mk-choice-opt{position:relative;display:block;cursor:pointer;min-width:0}
.mk-choice-opt input{position:absolute;opacity:0;inset:0;width:100%!important;height:100%;margin:0;cursor:pointer;z-index:1}
.mk-choice-card{display:flex;gap:.75rem;align-items:flex-start;height:100%;padding:.9rem 1rem;border:1.5px solid #e2e8f0;border-radius:12px;background:#fff;transition:border-color .15s,box-shadow .15s,background .15s}
.mk-choice-card .mk-radio{flex:none;width:18px;height:18px;margin-top:.15rem;border:2px solid #cbd5e1;border-radius:50%;background:#fff;transition:all .15s}
.mk-choice-card strong{display:block;font-size:.9rem;font-weight:700;color:#0f172a}
.mk-choice-card small{display:block;margin-top:.15rem;font-size:.78rem;color:#64748b;line-height:1.45}
.mk-choice-opt:hover .mk-choice-card{border-color:#99d5ce}
.mk-choice-opt input:focus-visible+.mk-choice-card{box-shadow:0 0 0 3px rgba(20,184,166,.25)}
.mk-choice-opt input:checked+.mk-choice-card{border-color:#0f766e;background:#f0fdfa;box-shadow:0 0 0 3px rgba(15,118,110,.10)}
.mk-choice-opt input:checked+.mk-choice-card .mk-radio{border-color:#0f766e;background:radial-gradient(circle,#0f766e 0 4px,#fff 5px)}
.mk-choice-opt.is-live input:checked+.mk-choice-card{border-color:#b45309;background:#fffbeb;box-shadow:0 0 0 3px rgba(180,83,9,.10)}
.mk-choice-opt.is-live input:checked+.mk-choice-card .mk-radio{border-color:#b45309;background:radial-gradient(circle,#b45309 0 4px,#fff 5px)}
/* django RadioSelect rendered inside .mk-field */
.mk-form ul[id^="id_kind"],.mk-form #id_kind{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:.75rem}
.mk-form #id_kind>div{position:relative;margin:0}
.mk-form #id_kind label{display:flex;gap:.7rem;align-items:center;padding:.9rem 1rem;border:1.5px solid #e2e8f0;border-radius:12px;background:#fff;font-size:.9rem;font-weight:600;color:#0f172a;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.mk-form #id_kind label:hover{border-color:#99d5ce}
.mk-form #id_kind input{width:1.05rem;height:1.05rem;min-height:0;accent-color:#0f766e;flex:none}
.mk-form #id_kind label:has(input:checked){border-color:#0f766e;background:#f0fdfa;box-shadow:0 0 0 3px rgba(15,118,110,.10)}
/* switch */
.mk-switch{position:relative;display:flex;gap:.9rem;align-items:center;justify-content:space-between;padding:.85rem 1rem;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;cursor:pointer}
.mk-switch strong{display:block;font-size:.875rem;color:#0f172a}.mk-switch small{display:block;font-size:.78rem;color:#64748b;margin-top:.1rem;line-height:1.45}
.mk-switch input{position:absolute;opacity:0;width:1px!important;height:1px;min-height:0!important}
.mk-switch .mk-sw{position:relative;flex:none;width:42px;height:24px;border-radius:999px;background:#cbd5e1;transition:background .18s}
.mk-switch .mk-sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.3);transition:transform .18s}
.mk-switch input:checked~.mk-sw{background:#0f766e}.mk-switch input:checked~.mk-sw::after{transform:translateX(18px)}
.mk-switch input:focus-visible~.mk-sw{box-shadow:0 0 0 3px rgba(20,184,166,.3)}
/* input affix + secret field */
.mk-affix{display:flex;align-items:stretch;border:1px solid #dbe3ec;border-radius:.625rem;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.mk-affix:focus-within{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.mk-affix>span{display:grid;place-items:center;padding:0 .8rem;background:#f1f5f9;color:#475569;font-size:.78rem;font-weight:700;border-right:1px solid #e2e8f0;white-space:nowrap}
.mk-page .mk-form .mk-affix input{border:0!important;box-shadow:none!important;border-radius:0!important;min-width:0}
.mk-secret{display:flex;align-items:stretch;border:1px solid #dbe3ec;border-radius:.625rem;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.mk-secret:focus-within{border-color:#0f766e;box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.mk-page .mk-form .mk-secret input{flex:1;min-width:0;border:0!important;box-shadow:none!important;border-radius:0!important;background:transparent!important}
.mk-masked{-webkit-text-security:disc;text-security:disc}
.mk-secret input::-ms-reveal{display:none}
.mk-secret input::-ms-clear{display:none}
.mk-secret input::-webkit-credentials-auto-fill-button{visibility:hidden;display:none!important;pointer-events:none;position:absolute;right:0}
.mk-secret>button{flex:none;min-width:4.25rem;padding:0 .9rem;border:0;border-left:1px solid #e2e8f0;border-radius:0;background:#f8fafc!important;color:#0f766e!important;font-size:.78rem;font-weight:700;line-height:1;cursor:pointer;transition:background .15s}
.mk-secret>button:hover{background:#f0fdfa!important}
.mk-saved{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;color:#15803d;background:#dcfce7;border-radius:999px;padding:.1rem .5rem;margin-left:.4rem;vertical-align:middle}
/* upload with preview */
.mk-upload{display:flex;gap:1rem;align-items:center;padding:1rem;border:1.5px dashed #cbd5e1;border-radius:12px;background:#f8fafc;transition:border-color .15s,background .15s}
.mk-upload:hover{border-color:#5eb8ae;background:#f0fdfa}
.mk-upload-prev{flex:none;display:grid;place-items:center;width:72px;height:72px;border-radius:14px;background:#fff;border:1px solid #e2e8f0;overflow:hidden;color:#94a3b8}
.mk-upload-prev img{width:100%;height:100%;object-fit:cover;display:block}
.mk-upload-prev svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mk-upload-txt{min-width:0;flex:1;display:grid;gap:.4rem}
.mk-upload-txt strong{font-size:.875rem;color:#0f172a}.mk-upload-txt small{font-size:.78rem;color:#64748b}
.mk-page .mk-upload input[type=file]{border:0;background:transparent;padding:0;min-height:0;font-size:.78rem}
.mk-linkprev{display:flex;gap:.6rem;align-items:center;padding:.6rem .75rem;border:1px solid #e2e8f0;border-radius:.65rem;background:#fff;font-size:.78rem;color:#334155;overflow-wrap:anywhere}
.mk-linkprev svg{width:15px;height:15px;flex:none;stroke:#0f766e;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* sticky action bar */
.mk-actionbar{display:flex;gap:.6rem;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:.85rem 1.25rem;border:1px solid #e2e8f0;border-radius:14px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);box-shadow:0 -4px 18px rgba(15,23,42,.05);position:sticky;bottom:.75rem;z-index:3}
.mk-actionbar>span{font-size:.78rem;color:#64748b}
.mk-actionbar .mk-actions{margin-left:auto}
.mk-actionbar .btn,.mk-actionbar .btn *{color:inherit}
.mk-actionbar .btn-primary,.mk-actionbar .btn-primary *{color:#fff!important}
.mk-page input[type=file]::file-selector-button{margin-right:.75rem;padding:.45rem .9rem;border:1px solid #cbd5e1;border-radius:.5rem;background:#fff;color:#0f766e;font-weight:600;font-size:.8125rem;cursor:pointer;transition:background .15s,border-color .15s}
.mk-page input[type=file]::file-selector-button:hover{background:#f0fdfa;border-color:#5eb8ae}
.mk-page .mk-actionbar .mk-form-actions{all:unset}
/* listing kind chooser (v74) */
.mk-kinds{display:grid;gap:1rem;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch}
.mk-kind{display:flex;flex-direction:column;gap:.7rem;min-width:0;padding:1.3rem;border:1px solid #e2e8f0;border-radius:16px;background:#fff;color:inherit!important;text-decoration:none!important;box-shadow:0 1px 2px rgba(15,23,42,.035);transition:border-color .18s,box-shadow .18s,transform .18s}
.mk-kind:hover,.mk-kind:focus-visible{border-color:#7cc4bb;box-shadow:0 12px 30px rgba(15,118,110,.10);transform:translateY(-2px)}
.mk-kind-ico{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#f0fdfa;color:#0f766e;transition:background .18s,color .18s}
.mk-kind:hover .mk-kind-ico{background:#0f766e;color:#fff}
.mk-kind-ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mk-kind h2{margin:.2rem 0 0;font-size:1.05rem;font-weight:750;color:#0f172a;letter-spacing:-.02em}
.mk-kind p{margin:0;font-size:.85rem;color:#526174;line-height:1.6}
.mk-kind ul{margin:.1rem 0 0;padding:0;list-style:none;display:grid;gap:.45rem}
.mk-kind li{display:flex;gap:.5rem;align-items:flex-start;font-size:.8125rem;color:#475569;line-height:1.5}
.mk-kind li svg{flex:none;width:15px;height:15px;margin-top:.2rem;stroke:#0f766e;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mk-kind-go{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:.9rem;border-top:1px solid #eef2f6;font-weight:700;font-size:.875rem;color:#0f766e}
.mk-kind-go svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
.mk-kind:hover .mk-kind-go svg{transform:translateX(3px)}
/* dashboard */
.mk-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.75rem}
.mk-kpi{display:flex;gap:.8rem;align-items:center;padding:.95rem 1.05rem;border:1px solid #e2e8f0;border-radius:14px;background:#fff;color:inherit!important;text-decoration:none!important;transition:border-color .16s,box-shadow .16s,transform .16s}
a.mk-kpi:hover{border-color:#8fcfc7;box-shadow:0 6px 18px rgba(15,118,110,.08);transform:translateY(-1px)}
.mk-kpi-ico{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:11px;background:#f0fdfa;color:#0f766e}
.mk-kpi-ico.is-amber{background:#fffbeb;color:#b45309}.mk-kpi-ico.is-blue{background:#eff6ff;color:#1d4ed8}.mk-kpi-ico.is-slate{background:#f1f5f9;color:#475569}
.mk-kpi-ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mk-kpi b{display:block;font-size:1.4rem;line-height:1.15;color:#0f172a;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mk-kpi span{display:block;font-size:.75rem;color:#64748b;font-weight:600;margin-top:.1rem}
.mk-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
.mk-quick a{display:flex;gap:.55rem;align-items:center;padding:.7rem .85rem;border:1px solid #e2e8f0;border-radius:11px;background:#fff;font-size:.8125rem;font-weight:600;color:#334155!important;text-decoration:none!important;transition:border-color .15s,background .15s,color .15s}
.mk-quick a:hover{border-color:#8fcfc7;background:#f0fdfa;color:#0f766e!important}
.mk-quick a svg{width:16px;height:16px;flex:none;stroke:#0f766e;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mk-plan{display:grid;gap:.55rem;align-content:start;padding:1.05rem 1.15rem;border:1px solid #e2e8f0;border-radius:13px;background:#fff}
.mk-plan-top{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start}
.mk-plan h3{margin:0;font-size:.95rem;font-weight:700;color:#0f172a}
.mk-plan .mk-price{font-size:1.15rem;font-weight:750;color:#0f172a;letter-spacing:-.02em}.mk-plan .mk-price small{font-size:.75rem;color:#64748b;font-weight:500}
.mk-plan p{margin:0;font-size:.8125rem;color:#64748b;line-height:1.55}
.mk-plan.is-on{border-color:#99d5ce;background:linear-gradient(180deg,#f7fefc,#fff)}
@media(max-width:1060px){.mk-layout{grid-template-columns:minmax(0,1fr)}.mk-aside{position:static;order:-1;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}}
@media(max-width:900px){.mk-kinds{grid-template-columns:1fr 1fr}.mk-kinds .mk-kind:last-child{grid-column:1/-1}}
@media(max-width:640px){.mk-kinds{grid-template-columns:1fr}.mk-kinds .mk-kind:last-child{grid-column:auto}.mk-hero{padding:1rem}.mk-hero-icon{display:none}.mk-sect-h,.mk-sect-b{padding-left:1rem;padding-right:1rem}.mk-actionbar{position:static;padding:.85rem 1rem}.mk-actionbar .btn{flex:1}.mk-upload{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){.mk-kind,.mk-kpi,.mk-choice-card,.mk-switch .mk-sw,.mk-switch .mk-sw::after{transition:none}}

/* V75 Seller Centre - calm professional layout: one purpose per page, generous spacing, consistent headers. */
.mk-page{gap:1.25rem}
.mk-page.mk-wide{max-width:1240px}
.mk-welcome{display:flex;gap:1.25rem;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:1.35rem 1.5rem;border:1px solid #e2e8f0;border-radius:18px;background:linear-gradient(115deg,#0f766e 0%,#115e59 55%,#134e4a 100%);color:#fff;box-shadow:0 10px 30px rgba(15,118,110,.18)}
.mk-welcome h1{margin:0;font-size:clamp(1.25rem,2.4vw,1.65rem);font-weight:750;letter-spacing:-.03em;color:#fff;line-height:1.25}
.mk-welcome p{margin:.3rem 0 0;font-size:.875rem;color:rgba(255,255,255,.82);line-height:1.55;max-width:60ch}
.mk-welcome-id{display:flex;gap:.9rem;align-items:center;min-width:0}
.mk-avatar{display:grid;place-items:center;flex:none;width:54px;height:54px;border-radius:15px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);font-size:1.3rem;font-weight:750;color:#fff;overflow:hidden}
.mk-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.mk-welcome .mk-chipline{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.55rem}
.mk-welcome .mk-badge{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.22)}
.mk-welcome .mk-badge.is-live{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.mk-welcome .btn-light{background:#fff;color:#0f766e!important;border:1px solid #fff;font-weight:700}
.mk-welcome .btn-light:hover{background:#f0fdfa}
.mk-welcome .btn-ghost-light{background:transparent;color:#fff!important;border:1px solid rgba(255,255,255,.45)}
.mk-welcome .btn-ghost-light:hover{background:rgba(255,255,255,.12)}
.mk-welcome .mk-actions .btn{text-decoration:none!important}

/* section heading used between blocks on a page */
.mk-block-h{display:flex;justify-content:space-between;align-items:flex-end;gap:.75rem;flex-wrap:wrap;margin:0 0 .75rem}
.mk-block-h h2{margin:0;font-size:1.02rem;font-weight:750;color:#0f172a;letter-spacing:-.015em}
.mk-block-h p{margin:.15rem 0 0;font-size:.8125rem;color:#64748b}
.mk-block-h a{font-size:.8125rem;font-weight:600}

/* getting started */
.mk-start{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:0;border:1px solid #e2e8f0;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.035)}
.mk-start-side{padding:1.35rem;background:linear-gradient(180deg,#f0fdfa,#f8fafc);border-right:1px solid #e2e8f0;display:grid;gap:.8rem;align-content:start}
.mk-start-side h2{margin:0;font-size:1.05rem;font-weight:750;color:#0f172a;letter-spacing:-.02em}
.mk-start-side p{margin:0;font-size:.8125rem;color:#526174;line-height:1.6}
.mk-progress{height:8px;border-radius:999px;background:#d7e6e3;overflow:hidden}
.mk-progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#14b8a6,#0f766e);transition:width .4s}
.mk-progress-label{display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;color:#0f766e}
.mk-steplist{list-style:none;margin:0;padding:.4rem 0;display:grid}
.mk-steplist li{border-bottom:1px solid #f1f5f9}
.mk-steplist li:last-child{border-bottom:0}
.mk-steplist a.mk-step{display:flex;gap:.85rem;align-items:center;padding:.85rem 1.25rem;color:inherit!important;text-decoration:none!important;transition:background .15s}
.mk-steplist a.mk-step:hover{background:#f8fafc}
.mk-step-dot{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #cbd5e1;color:#94a3b8;font-size:.75rem;font-weight:700;background:#fff}
.mk-step-dot svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mk-step.is-done .mk-step-dot{background:#0f766e;border-color:#0f766e;color:#fff}
.mk-step.is-next .mk-step-dot{border-color:#0f766e;color:#0f766e;box-shadow:0 0 0 4px rgba(15,118,110,.12)}
.mk-step b{display:block;font-size:.875rem;font-weight:650;color:#0f172a}
.mk-step small{display:block;font-size:.78rem;color:#64748b;margin-top:.1rem}
.mk-step.is-done b{color:#64748b;text-decoration:line-through;text-decoration-color:#cbd5e1}
.mk-step-go{margin-left:auto;font-size:.78rem;font-weight:700;color:#0f766e;white-space:nowrap}
.mk-step.is-done .mk-step-go{display:none}

/* KPI row: four calm tiles */
.mk-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem}
.mk-metric{display:grid;gap:.35rem;padding:1.1rem 1.2rem;border:1px solid #e2e8f0;border-radius:16px;background:#fff;color:inherit!important;text-decoration:none!important;box-shadow:0 1px 2px rgba(15,23,42,.035);transition:border-color .16s,box-shadow .16s,transform .16s}
a.mk-metric:hover{border-color:#8fcfc7;box-shadow:0 8px 22px rgba(15,118,110,.09);transform:translateY(-1px)}
.mk-metric-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.mk-metric-top span{font-size:.78rem;font-weight:650;color:#64748b}
.mk-metric-top i{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:#f0fdfa;color:#0f766e;font-style:normal}
.mk-metric-top i.is-amber{background:#fffbeb;color:#b45309}.mk-metric-top i.is-blue{background:#eff6ff;color:#1d4ed8}.mk-metric-top i.is-slate{background:#f1f5f9;color:#475569}
.mk-metric-top svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mk-metric strong{font-size:1.6rem;line-height:1.1;font-weight:775;color:#0f172a;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.mk-metric strong small{font-size:.8rem;font-weight:650;color:#64748b;letter-spacing:0;margin-right:.2rem}
