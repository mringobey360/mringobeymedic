{% if links %}<div class="sx-wrap">{% if caption %}<span class="sx-cap">{{ caption }}</span>{% endif %}<ul class="sx-social{% if compact %} sx-sm{% endif %}" aria-label="{{ store.public_name }} on social media">{% for l in links %}<li><a class="sx-btn sx-{{ l.key }}{% if l.verified %} is-verified{% endif %}" href="{{ l.url }}" target="_blank" rel="noopener noreferrer nofollow" aria-label="{{ l.label }}{% if l.verified %} (verified account){% endif %}: {{ store.public_name }}" title="{{ l.label }}{% if l.verified %} - Verified by SmartPOS{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="{{ l.path }}"/></svg>{% if l.verified %}<span class="sx-vb" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>{% endif %}</a></li>{% endfor %}</ul>{% if any_verified and not compact %}<span class="sx-legend"><span class="sx-vb sx-vb-inline" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Verified by SmartPOS</span>{% endif %}</div>{% endif %}
