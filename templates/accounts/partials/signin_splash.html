{% load static %}
<style id="ss-styles">
    /* ===== SmartPOS sign-in splash v2 — professional, animated, dynamic ===== */
    .ss{--ss-a:#5eead4;--ss-b:#14b8a6;--ss-ok:#4ade80;position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:max(1.25rem,env(safe-area-inset-top)) 1.25rem max(1.25rem,env(safe-area-inset-bottom));overflow:hidden;color:#fff;font-family:inherit;background:radial-gradient(120% 90% at 50% 0%,#0f766e 0%,#064e47 45%,#032f2b 100%);opacity:0;transition:opacity .45s ease;pointer-events:all;-webkit-tap-highlight-color:transparent}
    .ss.on{opacity:1}
    .ss.is-done .ss-card{animation:ssDone .6s ease forwards}
    /* drifting light blobs */
    .ss-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.38;will-change:transform}
    .ss-blob.b1{width:22rem;height:22rem;left:-7rem;top:-6rem;background:#14b8a6;animation:ssDrift1 14s ease-in-out infinite alternate}
    .ss-blob.b2{width:20rem;height:20rem;right:-8rem;bottom:-6rem;background:#0ea5a0;animation:ssDrift2 17s ease-in-out infinite alternate}
    .ss-blob.b3{width:12rem;height:12rem;right:10%;top:12%;background:#22d3ee;opacity:.16;animation:ssDrift1 11s ease-in-out infinite alternate-reverse}
    /* subtle business-grid backdrop + rising neutral shapes (no medical motifs) */
    .ss-grid{position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(153,246,228,.2) 1px,transparent 1.2px);background-size:26px 26px;-webkit-mask-image:radial-gradient(70% 60% at 50% 45%,#000 30%,transparent 100%);mask-image:radial-gradient(70% 60% at 50% 45%,#000 30%,transparent 100%)}
    .ss-fx{position:absolute;inset:0;pointer-events:none}
    .ss-fx i{position:absolute;bottom:-2rem;--r:0deg;width:var(--s);height:var(--s);left:var(--x);opacity:0;border-radius:3px;border:1.5px solid rgba(153,246,228,.45);animation:ssRise var(--d) linear var(--t) infinite}
    .ss-fx i.ring{border-radius:50%}
    .ss-fx i.dot{border:0;border-radius:50%;background:rgba(153,246,228,.4);width:calc(var(--s)*.45);height:calc(var(--s)*.45)}
    /* faint rising sales-trend line behind the card */
    .ss-ecg{position:absolute;left:0;right:0;top:auto;bottom:9%;width:100%;height:5rem;opacity:.4;pointer-events:none}
    .ss-ecg path{fill:none;stroke:url(#ssEcgGrad);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:320 980;animation:ssEcg 4s linear infinite}
    @keyframes ssEcg{from{stroke-dashoffset:320}to{stroke-dashoffset:-980}}
    /* card */
    .ss-card{position:relative;width:min(21rem,100%);text-align:center;opacity:0;transform:translateY(14px) scale(.98);animation:ssIn .7s .1s cubic-bezier(.2,.8,.2,1) forwards}
    .ss-emblem{position:relative;width:7rem;height:7rem;margin:0 auto 1.1rem}
    .ss-emblem svg.ss-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
    .ss-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
    .ss-ring .trk{stroke:rgba(255,255,255,.14)}
    .ss-ring .arc{stroke:url(#ssGrad);stroke-dasharray:289;stroke-dashoffset:289;transition:stroke-dashoffset .25s linear}
    .ss-emblem::before{content:"";position:absolute;inset:.55rem;border-radius:50%;border:1px solid rgba(94,234,212,.5);animation:ssPulse 2.2s ease-out infinite}
    .ss-emblem::after{content:"";position:absolute;inset:.55rem;border-radius:50%;border:1px solid rgba(94,234,212,.35);animation:ssPulse 2.2s 1.1s ease-out infinite}
    .ss-logo{position:absolute;inset:1.05rem;border-radius:1.25rem;background:#fff;padding:.4rem;box-shadow:0 14px 34px -10px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;animation:ssFloat 3s ease-in-out infinite}
    .ss-logo img{width:100%;height:100%;object-fit:contain;border-radius:.8rem}
    .ss-badge{position:absolute;right:.1rem;bottom:.2rem;width:1.75rem;height:1.75rem;border-radius:50%;background:linear-gradient(135deg,#4ade80,#16a34a);border:2px solid #064e47;display:flex;align-items:center;justify-content:center;transform:scale(0);animation:ssPop .5s .55s cubic-bezier(.34,1.56,.64,1) forwards;box-shadow:0 6px 14px -4px rgba(0,0,0,.5)}
    .ss-badge svg{width:.95rem;height:.95rem;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18;stroke-dashoffset:18;animation:ssDraw .35s .9s ease forwards}
    .ss-hello{font-size:.7rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(167,243,208,.9)}
    .ss-title{margin-top:.35rem;font-size:1.4rem;font-weight:750;letter-spacing:-.02em;line-height:1.2}
    .ss-sub{margin-top:.4rem;min-height:1.2rem;font-size:.84rem;color:rgba(204,251,241,.9);transition:opacity .2s ease}
    .ss-sub.swap{opacity:0}
    /* progress */
    .ss-bar{display:flex;align-items:center;gap:.65rem;margin:1.15rem auto 0;max-width:15.5rem}
    .ss-track{flex:1;height:6px;border-radius:9999px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
    .ss-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#2dd4bf,#5eead4,#a7f3d0);position:relative;transition:width .25s linear}
    .ss-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);transform:translateX(-100%);animation:ssShine 1.5s ease-in-out infinite}
    .ss-pct{min-width:2.4rem;text-align:right;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:#ccfbf1}
    /* steps */
    .ss-steps{list-style:none;margin:1.15rem auto 0;padding:.35rem .3rem;max-width:15.5rem;text-align:left;border-radius:1rem;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    .ss-steps li{display:flex;align-items:center;gap:.65rem;padding:.42rem .65rem;font-size:.8rem;color:rgba(204,251,241,.5);transition:color .3s ease,transform .3s ease}
    .ss-ico{position:relative;flex:none;width:1.15rem;height:1.15rem;border-radius:50%;border:2px solid rgba(255,255,255,.22);transition:all .3s ease}
    .ss-ico svg{position:absolute;inset:0;width:100%;height:100%;stroke:#053b36;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0;stroke-dasharray:18;stroke-dashoffset:18}
    .ss-steps li.is-active{color:#fff;transform:translateX(2px)}
    .ss-steps li.is-active .ss-ico{border-color:rgba(94,234,212,.3);border-top-color:#5eead4;animation:ssSpin .8s linear infinite}
    .ss-steps li.is-done{color:rgba(236,253,245,.92)}
    .ss-steps li.is-done .ss-ico{background:var(--ss-ok);border-color:var(--ss-ok);animation:ssPop .4s cubic-bezier(.34,1.56,.64,1)}
    .ss-steps li.is-done .ss-ico svg{opacity:1;animation:ssDraw .3s .05s ease forwards}
    /* footer + slow-connection hint */
    .ss-foot{margin-top:1.1rem;display:inline-flex;align-items:center;gap:.4rem;font-size:.7rem;color:rgba(167,243,208,.8)}
    .ss-foot svg{width:.85rem;height:.85rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .ss-slow{max-height:0;overflow:hidden;opacity:0;margin-top:0;font-size:.75rem;line-height:1.45;color:#fde68a;transition:max-height .4s ease,opacity .4s ease,margin .4s ease}
    .ss.is-slow .ss-slow{max-height:4rem;opacity:1;margin-top:.8rem}
    /* resumed on the dashboard: look identical to the login splash, no replayed entrance animations */
    .ss.ss-resume{opacity:1;transition:none}
    .ss-resume .ss-card{animation:none;opacity:1;transform:none}
    .ss-resume .ss-badge{animation:none;transform:scale(1)}
    .ss-resume .ss-badge svg{animation:none;stroke-dashoffset:0}
    .ss.ss-out{opacity:0!important;transition:opacity .5s ease!important;pointer-events:none}
    @keyframes ssIn{to{opacity:1;transform:none}}
    @keyframes ssDone{0%{transform:none}40%{transform:scale(1.03)}100%{transform:scale(.99);opacity:.96}}
    @keyframes ssDrift1{from{transform:translate(0,0) scale(1)}to{transform:translate(4rem,3rem) scale(1.2)}}
    @keyframes ssDrift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-4rem,-3rem) scale(.9)}}
    @keyframes ssRise{0%{transform:translateY(0) rotate(var(--r));opacity:0}12%{opacity:.7}85%{opacity:.5}100%{transform:translateY(-110vh) rotate(calc(var(--r) + 140deg));opacity:0}}
    @keyframes ssPulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.45);opacity:0}}
    @keyframes ssFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    @keyframes ssPop{0%{transform:scale(0)}100%{transform:scale(1)}}
    @keyframes ssDraw{to{stroke-dashoffset:0}}
    @keyframes ssSpin{to{transform:rotate(360deg)}}
    @keyframes ssShine{to{transform:translateX(100%)}}
    @media(max-height:600px){.ss-emblem{width:5.5rem;height:5.5rem;margin-bottom:.7rem}.ss-logo{inset:.8rem}.ss-steps{margin-top:.8rem}.ss-title{font-size:1.2rem}}
    @media(prefers-reduced-motion:reduce){.ss *,.ss *::before,.ss *::after{animation-duration:.01ms!important;animation-iteration-count:1!important}.ss-fx,.ss-blob,.ss-ecg,.ss-grid{display:none}.ss-card{opacity:1;transform:none}.ss-badge{transform:scale(1)}.ss-badge svg{stroke-dashoffset:0}}
</style>
<script>
/* Shared sign-in splash. Usage: var s = SignInSplash.show(); ... s.finish(); SignInSplash.hide() */
window.SignInSplash=(function(){
  var LOGO="{% static 'img/icons/icon-192.png' %}?v=3";
  /* Two wordings, one theme: "signin" (after login) and "launch" (app/PWA opened with a session already active). */
  var CFG={
    signin:{
      aria:'Signing in to SmartPOS', title:'Signed in securely', badge:true,
      steps:['Secure session established','Syncing your inventory','Checking stock alerts','Preparing sales &amp; customers','Opening SmartPOS dashboard'],
      subs:['Securing your session…','Syncing your inventory…','Checking stock levels and alerts…','Preparing sales and customers…','Opening your SmartPOS dashboard…'],
      foot:'<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Encrypted session · Your data is protected',
      slow:'Still preparing SmartPOS — your connection looks slow. Please keep this page open; you will be taken in automatically.'
    },
    launch:{
      aria:'Starting SmartPOS', title:'Welcome to SmartPOS', badge:false,
      steps:['Starting SmartPOS','Loading your workspace','Updating sales &amp; stock','Preparing your dashboard','Almost ready'],
      subs:['Starting SmartPOS…','Loading your workspace…','Updating sales and stock…','Preparing your dashboard…','Opening SmartPOS…'],
      foot:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Your business, sales and stock — ready when you are',
      slow:'Still starting SmartPOS — your connection looks slow. Please keep this page open.'
    }
  };
  var current=null;
  /* Greeting follows the SERVER clock (Africa/Dar_es_Salaam), not the device clock, so it is always correct. */
  var SRV_MIN=parseInt("{% now "G" %}",10)*60+parseInt("{% now "i" %}",10), SRV_T0=Date.now();
  function greeting(){var m=(SRV_MIN+Math.floor((Date.now()-SRV_T0)/60000))%1440,h=Math.floor(m/60);return h<12?'Good morning':(h<17?'Good afternoon':'Good evening');}
  function fx(){var h='',i;for(i=0;i<10;i++){h+='<i class="'+(i%3===1?'ring':(i%3===2?'dot':''))+'" style="--x:'+(5+i*10+(i%3)*3)+'%;--s:'+(10+(i%4)*4)+'px;--d:'+(10+(i%5)*2.5)+'s;--t:-'+(i*1.9).toFixed(1)+'s;--r:'+(i*37%180)+'deg"></i>';}return h;}
  function build(C){
    var steps='',i;
    for(i=0;i<C.steps.length;i++)steps+='<li data-i="'+i+'"><span class="ss-ico"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></span><span>'+C.steps[i]+'</span></li>';
    var el=document.createElement('div');
    el.className='ss';el.setAttribute('role','status');el.setAttribute('aria-label',C.aria);
    el.innerHTML=
      '<div class="ss-blob b1"></div><div class="ss-blob b2"></div><div class="ss-blob b3"></div><div class="ss-grid" aria-hidden="true"></div><div class="ss-fx" aria-hidden="true">'+fx()+'</div>'+
      '<svg class="ss-ecg" viewBox="0 0 1000 80" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="ssEcgGrad" x1="0" x2="1"><stop offset="0" stop-color="#5eead4" stop-opacity="0"/><stop offset=".5" stop-color="#99f6e4"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></linearGradient></defs><path d="M0 66 C120 62 180 54 260 50 S400 56 480 40 S640 30 720 22 S900 14 1000 6"/></svg>'+
      '<div class="ss-card">'+
        '<div class="ss-emblem" aria-hidden="true">'+
          '<svg class="ss-ring" viewBox="0 0 100 100"><defs><linearGradient id="ssGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient></defs><circle class="trk" cx="50" cy="50" r="46"/><circle class="arc" cx="50" cy="50" r="46"/></svg>'+
          '<div class="ss-logo"><img src="'+LOGO+'" alt="" decoding="async"></div>'+
          (C.badge?'<div class="ss-badge"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></div>':'')+
        '</div>'+
        '<div class="ss-hello">'+greeting()+'</div>'+
        '<div class="ss-title">'+C.title+'</div>'+
        '<div class="ss-sub" aria-live="polite">'+C.subs[0]+'</div>'+
        '<div class="ss-bar"><div class="ss-track"><div class="ss-fill"></div></div><div class="ss-pct">0%</div></div>'+
        '<ul class="ss-steps">'+steps+'</ul>'+
        '<div class="ss-foot">'+C.foot+'</div>'+
        '<div class="ss-slow">'+C.slow+'</div>'+
      '</div>';
    return el;
  }
  function show(opts){
    opts=opts||{};
    if(current)return current.api;
    var C=CFG[opts.variant==='launch'?'launch':'signin'],STEPS=C.steps,SUBS=C.subs;
    var el=build(C),fill=el.querySelector('.ss-fill'),pct=el.querySelector('.ss-pct'),arc=el.querySelector('.ss-ring .arc'),sub=el.querySelector('.ss-sub'),lis=el.querySelectorAll('.ss-steps li');
    var p=Math.max(0,Math.min(99,+opts.resume||0)),target=92,raf=0,stepIdx=-1,finished=false,slowT=0,t0=Date.now(),swapT=0;
    function setStep(n){
      if(n===stepIdx)return;stepIdx=n;
      for(var i=0;i<lis.length;i++){lis[i].className=i<n?'is-done':(i===n?'is-active':'');}
      if(n<SUBS.length){sub.classList.add('swap');clearTimeout(swapT);swapT=setTimeout(function(){sub.textContent=SUBS[n];sub.classList.remove('swap');},180);}
    }
    function paint(){
      var v=Math.min(100,Math.round(p));
      fill.style.width=p+'%';pct.textContent=v+'%';arc.style.strokeDashoffset=(289*(1-p/100)).toFixed(1);
      if(!finished)setStep(1+Math.min(STEPS.length-2,Math.floor(p/20)));
    }
    function tick(){
      if(finished)return;
      p+=(target-p)*0.012; if(p>target)p=target;   // eases toward 92% and never "hangs" at a hard number
      paint();raf=requestAnimationFrame(tick);
    }
    function finish(){
      if(finished)return;finished=true;cancelAnimationFrame(raf);clearTimeout(slowT);p=100;
      for(var i=0;i<lis.length;i++)lis[i].className='is-done';
      clearTimeout(swapT);sub.classList.remove('swap');sub.textContent='SmartPOS is ready';
      fill.style.width='100%';pct.textContent='100%';arc.style.strokeDashoffset='0';el.classList.add('is-done');
    }
    function fadeOut(){
      if(!el.parentNode)return;el.classList.remove('ss-resume');el.classList.add('on','ss-out');
      setTimeout(hide,560);
    }
    function hide(){try{sessionStorage.removeItem('sp_handoff');}catch(e){}cancelAnimationFrame(raf);clearTimeout(slowT);clearTimeout(swapT);if(el.parentNode)el.parentNode.removeChild(el);current=null;}
    if(!opts.resume&&!opts.mount){try{sessionStorage.setItem('sp_handoff',String(Date.now()));}catch(e){}}
    (opts.mount||document.body).appendChild(el);
    lis[0].className='is-done';
    if(opts.mount||opts.resume){el.classList.add('ss-resume','on');}else{requestAnimationFrame(function(){el.classList.add('on');});}
    setStep(1);raf=requestAnimationFrame(tick);
    slowT=setTimeout(function(){if(!finished)el.classList.add('is-slow');},7000);
    if(!opts.mount)window.addEventListener('pagehide',function(){try{sessionStorage.setItem('sp_handoff',String(Date.now()));sessionStorage.setItem('sp_handoff_p',String(p));}catch(e){}finish();},{once:true});
    current={el:el,api:{finish:finish,hide:hide,fadeOut:fadeOut}};
    return current.api;
  }
  function hide(){if(current)current.api.hide();}
  return {show:show,hide:hide};
})();
</script>
